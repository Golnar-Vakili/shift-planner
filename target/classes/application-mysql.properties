# Profile "mysql": use your MySQL (127.0.0.1:3306, user root)
# 1) In MySQL Workbench: create database:  CREATE DATABASE IF NOT EXISTS shiftplanner CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# 2) Set your root password below (same as in Workbench connection "hsnr")
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/shiftplanner?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# TEMP: set to 'update' once to auto-add new columns (e.g., profile_picture_path).
# After a successful boot, switch back to 'validate' for safety.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
