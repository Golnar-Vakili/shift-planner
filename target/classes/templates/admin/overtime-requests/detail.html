<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(content=~{::main})}">
<head>
	<title>Overtime request</title>
</head>
<body>
<main th:fragment="main">
	<section class="admin-shift-list-shell">
		<a class="admin-back-link" th:href="@{/admin/overtime-requests}">← Back to overtime requests</a>

		<h1 class="admin-page-title" th:text="${request.title}">Overtime request</h1>
		<p class="admin-page-desc">
			<span th:text="${request.workDate}">—</span>
			<span th:if="${request.startTime != null}"> • <span th:text="${request.startTime}">—</span></span>
			<span th:if="${request.endTime != null}"> – <span th:text="${request.endTime}">—</span></span>
		</p>

		<div class="dashboard-card" style="padding: var(--s4); margin-bottom: var(--s4);">
			<div style="display:flex; flex-wrap:wrap; gap: 8px; align-items:center; margin-bottom: 10px;">
				<span class="admin-status-badge admin-status-pending" th:text="|Pending ${request.pending}|">Pending</span>
				<span class="admin-status-badge admin-status-approved" th:text="|Accepted ${request.accepted}|">Accepted</span>
				<span class="admin-status-badge admin-status-rejected" th:text="|Declined ${request.declined}|">Declined</span>
				<span class="admin-status-badge" th:classappend="${'admin-status-' + request.status.name().toLowerCase()}" th:text="${request.status}">OPEN</span>
			</div>
			<p style="margin: 0; color: rgba(255,255,255,0.86);" th:text="${request.message != null ? request.message : '—'}">—</p>
		</div>

		<div class="admin-table-wrap">
			<table class="admin-table admin-shift-list-table" th:if="${recipients != null and !recipients.isEmpty()}">
				<thead>
				<tr>
					<th>Employee</th>
					<th style="width: 140px;">Response</th>
					<th style="width: 200px;">Responded at</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="r : ${recipients}">
					<td style="display:flex; align-items:center; gap: 10px;">
						<th:block th:if="${r.avatarUrl != null}">
							<img class="admin-overtime-avatar" th:src="${r.avatarUrl}" alt=""/>
						</th:block>
						<th:block th:unless="${r.avatarUrl != null}">
							<span class="admin-overtime-avatar admin-overtime-avatar-fallback" th:text="${#strings.toUpperCase(#strings.substring(r.employeeName,0,1))}">U</span>
						</th:block>
						<span th:text="${r.employeeName}">Employee</span>
					</td>
					<td>
						<span class="admin-status-badge"
						      th:classappend="${r.responseStatus == PENDING ? 'admin-status-pending' : (r.responseStatus == ACCEPTED ? 'admin-status-approved' : 'admin-status-rejected')}"
						      th:text="${r.responseStatus}">
							PENDING
						</span>
					</td>
					<td th:text="${r.respondedAt != null ? r.respondedAt : '—'}">—</td>
				</tr>
				</tbody>
			</table>
			<p class="admin-empty" th:if="${recipients == null or recipients.isEmpty()}">No recipients found.</p>
		</div>
	</section>
</main>
</body>
</html>
