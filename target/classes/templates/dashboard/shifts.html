<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{dashboard/layout :: layout(content=~{::main})}">
<head>
	<title>Select Shifts</title>
	<meta name="_csrf" th:content="${_csrf.token}" content=""/>
	<meta name="_csrf_header" th:content="${_csrf.headerName}" content="X-CSRF-TOKEN"/>
</head>
<body>
	<!-- Info box + calendar (no template panel) -->
	<main th:fragment="main" class="shifts-page shifts-page-minimal">
		<div id="shifts-toast-container" class="shifts-toast-container" aria-live="polite"></div>
		<div class="shifts-dashboard-three-col-grid">
			<div class="shifts-dashboard-overview-cell">
				<div class="shifts-info-box dashboard-card" aria-label="Your shift contract summary">
					<div class="shifts-info-box-head">
						<h3 class="shifts-info-box-title">Your shift overview</h3>
						<p class="shifts-info-box-summary" id="shifts-info-summary">You must plan 40 hours of shifts per week.</p>
					</div>
					<div id="shifts-plan-status-wrap" class="shifts-plan-status-box" role="status" aria-live="polite" style="display: none;">
						<p id="shifts-plan-status" class="shifts-plan-status-text"></p>
						<p id="shifts-plan-readonly-notice" class="shifts-plan-readonly-notice" style="display: none;"></p>
					</div>
				</div>
			</div>
			<div class="shifts-dashboard-summary-cell">
				<div id="shifts-summary-bar" class="shifts-summary-bar" aria-label="Shift plan summary">
					<span class="shifts-summary-item shifts-summary-planned"><span class="shifts-summary-label">Planned</span> <span id="shifts-summary-planned-value">—</span> h</span>
					<span class="shifts-summary-item shifts-summary-required"><span class="shifts-summary-label">Required</span> <span id="shifts-summary-required-value">40</span> h/week</span>
					<span class="shifts-summary-item shifts-summary-status"><span class="shifts-summary-label">Status</span> <span id="shifts-summary-status-value">—</span></span>
					<span class="shifts-summary-item shifts-summary-count"><span class="shifts-summary-label">Shifts</span> <span id="shifts-summary-count-value">0</span></span>
				</div>
			</div>
			<aside class="shifts-dashboard-legend-cell" aria-label="Shift status guide">
				<div class="shifts-legend shifts-legend-chips" aria-label="Shift status colors">
					<p class="shifts-legend-sidebar-title">Status Guide</p>
					<span class="shifts-legend-chip shifts-legend-chip-draft"><span class="shifts-legend-dot" aria-hidden="true"></span> Draft</span>
					<span class="shifts-legend-chip shifts-legend-chip-pending"><span class="shifts-legend-dot" aria-hidden="true"></span> Pending</span>
					<span class="shifts-legend-chip shifts-legend-chip-approved"><span class="shifts-legend-dot" aria-hidden="true"></span> Approved</span>
					<span class="shifts-legend-chip shifts-legend-chip-rejected"><span class="shifts-legend-dot" aria-hidden="true"></span> Rejected</span>
					<span class="shifts-legend-chip shifts-legend-chip-changes"><span class="shifts-legend-dot" aria-hidden="true"></span> Changes requested</span>
				</div>
			</aside>
			<div class="shifts-dashboard-calendar-cell">
				<div class="shifts-calendar-main">
					<div id="shifts-fullcalendar" class="shifts-calendar-size" style="min-height: 380px;"></div>
				</div>
			</div>
			<aside class="shifts-dashboard-weekly-cell" aria-label="Weekly hours progress">
				<div id="shifts-weekly-progress-column" class="shifts-weekly-progress-column" aria-label="Weekly hours progress"></div>
			</aside>
			<div class="shifts-dashboard-actions-cell">
				<div class="shifts-actions-row">
					<div class="shifts-overview-actions-flex" role="group" aria-label="Shift plan actions">
						<button type="button" id="btn-reset-planned-shifts" class="btn btn-secondary btn-shifts-secondary">Reset planned shifts</button>
						<button type="button" id="btn-submit-plan" class="btn btn-primary btn-shifts-primary" disabled>Submit plan for approval</button>
					</div>
				</div>
			</div>
		</div>
		<script th:src="@{/js/shifts.js}" src="../static/js/shifts.js"></script>
	</main>
</body>
</html>
