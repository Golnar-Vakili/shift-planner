# Profile "local": run without MySQL (in-memory H2). Use for quick local run.
# Activate with: Run Configuration -> VM options: -Dspring.profiles.active=local
# Or add to pom.xml spring-boot-maven-plugin <arguments>-Dspring.profiles.active=local</arguments>
spring.datasource.url=jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
