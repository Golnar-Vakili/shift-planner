<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{dashboard/layout :: layout(content=~{::main})}">
<head>
	<title>Overtime requests</title>
</head>
<body>
<main th:fragment="main" class="dashboard-home">
	<div class="dashboard-card" style="max-width: 980px;">
		<div class="dashboard-card-head">
			<h2 class="dashboard-card-title">Overtime requests</h2>
			<p class="dashboard-empty-state-sub" style="margin-top:6px;">Review and respond to overtime requests sent by admins.</p>
		</div>

		<div th:if="${successMessage}" class="dashboard-status-bar" role="status" style="margin-top: var(--s3);">
			<span class="dashboard-status-text" th:text="${successMessage}">Success</span>
		</div>
		<div th:if="${errorMessage}" class="dashboard-status-bar" role="status" style="margin-top: var(--s3); background: rgba(220,38,38,0.12); border-color: rgba(220,38,38,0.25);">
			<span class="dashboard-status-text" th:text="${errorMessage}">Error</span>
		</div>

		<div class="admin-table-wrap" style="margin-top: var(--s3);">
			<table class="admin-table" th:if="${items != null and !items.isEmpty()}">
				<thead>
				<tr>
					<th>Request</th>
					<th style="width: 120px;">Date</th>
					<th style="width: 150px;">Time</th>
					<th style="width: 120px;">Status</th>
					<th style="width: 240px;">Action</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="x : ${items}">
					<td>
						<div style="font-weight: 800;" th:text="${x.title}">Overtime</div>
						<div style="color: rgba(255,255,255,0.70); font-size: 0.92rem;" th:text="${x.message != null ? x.message : '—'}">—</div>
					</td>
					<td th:text="${x.workDate}">—</td>
					<td>
						<span th:text="${x.startTime != null ? x.startTime : '—'}">—</span>
						<span th:if="${x.endTime != null}"> – <span th:text="${x.endTime}">—</span></span>
					</td>
					<td>
						<span class="admin-status-badge"
						      th:classappend="${'admin-status-' + x.responseStatus.name().toLowerCase()}"
						      th:text="${x.responseStatus}">PENDING</span>
					</td>
					<td>
						<th:block th:if="${x.responseStatus.name() == 'PENDING'}">
							<form th:action="@{/dashboard/overtime-requests/{id}/respond(id=${x.recipientId})}" method="post" style="display:inline;">
								<input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
								<input type="hidden" name="response" value="ACCEPT"/>
								<button type="submit" class="btn btn-primary" style="min-width:110px;">Accept</button>
							</form>
							<form th:action="@{/dashboard/overtime-requests/{id}/respond(id=${x.recipientId})}" method="post" style="display:inline;">
								<input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
								<input type="hidden" name="response" value="DECLINE"/>
								<button type="submit" class="btn btn-secondary" style="min-width:110px;">Decline</button>
							</form>
						</th:block>
						<th:block th:unless="${x.responseStatus.name() == 'PENDING'}">
							<span style="color: rgba(255,255,255,0.72);">Responded</span>
						</th:block>
					</td>
				</tr>
				</tbody>
			</table>
			<p class="admin-empty" th:if="${items == null or items.isEmpty()}">No overtime requests yet.</p>
		</div>
	</div>
</main>
</body>
</html>
