<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title>Help &amp; Support</title>
	<link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css"/>
	<link rel="preconnect" href="https://fonts.googleapis.com"/>
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet"/>
</head>
<body class="help-page">
	<div class="help-container">
		<a th:href="@{/login}" class="back-link">← Back to login</a>
		<div class="help-card">
			<div class="help-header">
				<span class="help-icon" aria-hidden="true">?</span>
				<h1>Need help?</h1>
				<p class="help-subtitle">Submit a support request and our team will get back to you.</p>
			</div>

			<div th:if="${sent}" class="toast toast-success toast-inline" role="status">
				<span class="toast-icon" aria-hidden="true">✓</span>
				<span>Your request has been sent. We'll get back to you as soon as possible.</span>
			</div>

			<form th:action="@{/help}" method="post" class="help-form">
				<input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
				<div class="form-group">
					<label for="emailOrUsername">Username or email <span class="optional">(optional)</span></label>
					<input type="text" id="emailOrUsername" name="emailOrUsername" placeholder="e.g. jane@company.com or jane.doe" autocomplete="email"/>
				</div>
				<div class="form-group">
					<label for="issueCategory">Issue category</label>
					<select id="issueCategory" name="issueCategory" required>
						<option value="">-- Select your issue --</option>
						<option th:each="cat : ${categories}" th:value="${cat.name()}" th:text="${cat.displayLabel}">I can't log in</option>
					</select>
				</div>
				<div class="form-group">
					<label for="message">Message</label>
					<textarea id="message" name="message" rows="5" placeholder="Describe your issue in detail..." required></textarea>
				</div>
				<button type="submit" class="btn btn-block">Send request</button>
			</form>
		</div>
	</div>
</body>
</html>
