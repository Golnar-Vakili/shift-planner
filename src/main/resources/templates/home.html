<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title>Home</title>
	<link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css"/>
	<link rel="preconnect" href="https://fonts.googleapis.com"/>
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet"/>
</head>
<body class="home-page">
	<div class="home-box">
		<div th:if="${successMessage}" class="toast toast-success toast-inline" role="status">
			<span class="toast-icon" aria-hidden="true">✓</span>
			<span th:text="${successMessage}">Success</span>
		</div>
		<h1>Welcome, <span th:text="${displayName}">User</span></h1>
		<p>You are logged in as <strong th:text="${username}">username</strong>.</p>
		<p>Contract type: <strong th:text="${contractType}">contractType</strong></p>
		<form th:action="@{/logout}" method="post">
			<button type="submit" class="btn btn-secondary">Log out</button>
		</form>
	</div>
</body>
</html>
