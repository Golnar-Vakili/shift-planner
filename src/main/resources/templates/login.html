<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title>Sign in · Employee</title>
	<link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css"/>
	<meta name="_csrf" th:content="${_csrf.token}" content=""/>
	<meta name="_csrf_header" th:content="${_csrf.headerName}" content="X-CSRF-TOKEN"/>
	<link rel="preconnect" href="https://fonts.googleapis.com"/>
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet"/>
</head>
<body class="auth-page">
	<!-- Background layer: spheres only (parallax + floating) -->
	<div class="auth-bg" aria-hidden="true">
		<div class="spheres">
			<div class="sphere sphere-1"><div class="sphere-shape"></div></div>
			<div class="sphere sphere-2"><div class="sphere-shape"></div></div>
			<div class="sphere sphere-3"><div class="sphere-shape"></div></div>
			<div class="sphere sphere-4"><div class="sphere-shape"></div></div>
			<div class="sphere sphere-5"><div class="sphere-shape"></div></div>
			<div class="sphere sphere-6"><div class="sphere-shape"></div></div>
			<div class="sphere sphere-7"><div class="sphere-shape"></div></div>
			<div class="sphere sphere-8"><div class="sphere-shape"></div></div>
		</div>
	</div>

	<!-- Foreground layer: login card + toasts (fixed, no parallax) -->
	<div class="auth-fg">
	<div class="toast-list" aria-live="polite">
		<div th:if="${logoutMessage}" class="toast toast-success" role="status">
			<span class="toast-icon" aria-hidden="true">✓</span>
			<span th:text="${logoutMessage}">Logout message</span>
		</div>
		<div th:if="${errorMessage}" class="toast toast-error" role="alert">
			<span class="toast-icon" aria-hidden="true">!</span>
			<span th:text="${errorMessage}">Error message</span>
		</div>
		<div th:if="${registerError}" class="toast toast-error" role="alert">
			<span class="toast-icon" aria-hidden="true">!</span>
			<span th:text="${registerError}">Register error</span>
		</div>
	</div>

	<div class="auth-box">
		<h1 class="auth-title" th:text="${activeTab == 'register'} ? 'Register' : 'Login'">Login</h1>
		<p class="auth-subtitle" th:text="${activeTab == 'register'} ? 'Create an account' : 'Sign in to continue'">Sign in to continue</p>

		<div class="tabs-wrap">
			<div class="tabs" role="tablist">
				<button type="button" class="tab-btn" role="tab" data-tab="login" th:classappend="${activeTab == 'login'} ? 'active'">Login</button>
				<button type="button" class="tab-btn" role="tab" data-tab="register" th:classappend="${activeTab == 'register'} ? 'active'">Register</button>
				<span class="tab-slider" aria-hidden="true"></span>
			</div>
		</div>

		<div id="panel-login" class="tab-panel" role="tabpanel" th:classappend="${activeTab == 'login'} ? 'active'">
			<form th:action="@{/login}" method="post" class="auth-form">
				<input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
				<div class="form-group">
					<label for="username">Username</label>
					<input type="text" id="username" name="username" required autofocus autocomplete="username" placeholder="Enter your username"/>
				</div>
				<div class="form-group">
					<label for="password">Password</label>
					<input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password"/>
				</div>
				<button type="submit" class="btn btn-primary">Sign in</button>
			</form>
		</div>

		<div id="panel-register" class="tab-panel" role="tabpanel" th:classappend="${activeTab == 'register'} ? 'active'">
			<form id="form-register" class="auth-form" method="post" action="#" novalidate>
				<input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
				<div class="form-group">
					<label for="reg-contract">Contract type</label>
					<select id="reg-contract" name="contractType" aria-describedby="reg-contract-hint">
						<option value="">-- Select --</option>
						<option value="FULL_TIME">Full-time</option>
						<option value="PART_TIME">Part-time</option>
						<option value="MINI_JOB">Mini-job</option>
					</select>
					<span id="reg-contract-hint" class="form-hint">Optional; defaults to Full-time</span>
				</div>
				<div class="form-group">
					<label for="reg-username">Username <span class="required">*</span></label>
					<input type="text" id="reg-username" name="username" required minlength="2" maxlength="100" autocomplete="username" placeholder="Choose a username" aria-required="true"/>
					<span id="reg-username-error" class="form-error" role="alert" aria-live="polite"></span>
				</div>
				<div class="form-group">
					<label for="reg-password">Password <span class="required">*</span></label>
					<input type="password" id="reg-password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters" aria-required="true"/>
					<span id="reg-password-error" class="form-error" role="alert" aria-live="polite"></span>
				</div>
				<div class="form-group">
					<label for="reg-confirm">Confirm password <span class="required">*</span></label>
					<input type="password" id="reg-confirm" name="confirmPassword" required minlength="8" autocomplete="new-password" placeholder="Repeat password" aria-required="true"/>
					<span id="reg-confirm-error" class="form-error" role="alert" aria-live="polite"></span>
				</div>
				<button type="submit" class="btn btn-primary" id="btn-register-submit">Create account</button>
			</form>
		</div>
	</div>

	</div><!-- /auth-fg -->

	<a th:href="@{/help}" class="help-fab" aria-label="Need help?" title="Need help?">
		<span class="help-fab-icon" aria-hidden="true">?</span>
	</a>

	<script th:src="@{/js/auth.js}" src="../static/js/auth.js"></script>
</body>
</html>
