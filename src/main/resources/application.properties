server.port=8080
spring.application.name=employee-login

# Use MySQL (127.0.0.1:3306). Create database "shiftplanner" in Workbench and set password below.
spring.profiles.active=mysql

# Planning: first selectable date is (delay-days) after today; then (window-days) of planable range.
# Example: delay-days=21 → earliest selectable = March 27 when today is March 6.
shift-planning.delay-days=21
shift-planning.window-days=21

logging.file.name=employee-login.log

# Upload limits (profile pictures)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
